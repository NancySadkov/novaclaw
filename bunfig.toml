[install]
exact = true

# ─── the supply-chain control that actually works ──────────────────────────────────────────────────
# Refuse to install anything the lockfile does not already name. On 2026-08-04 the `keyv`/`cacheable`
# maintainer's package-registry account was taken over and poisoned releases went out carrying VALID npm
# provenance; a worm reached ~444 packages. We were not hit — and we survived on THIS, not on our
# version ranges: three of the poisoned versions were inside our declared `^` ranges
# (`@cacheable/utils ^2.5.0` → 2.5.1, `@cacheable/memory ^2.2.0` → 2.2.1, `cacheable ^2.3.1` → 2.5.1),
# so any re-resolving install between the compromise and the yank would have taken them. The lockfile
# was the only thing standing in the way, and this line is what makes every install honour it.
# Full measurement: novaclaw-plan `todo/supply-chain.md` §8.
#
# It lives HERE rather than as a flag on each `bun install` call site for one measured reason: bun reads
# the WORKSPACE-ROOT bunfig even when the install runs from a subdirectory (verified 2026-08-07 with
# cwd=packages/<x>, with `--cwd packages/<x>`, and with a subdirectory that has its own bunfig carrying
# no `[install]` section — all three refused). So it covers install paths nobody has written yet, which
# a per-call-site flag cannot. The call sites carry `--frozen-lockfile` as well, and
# `script/lib/install-paths.test.ts` pins both halves.
#
# ⚠️ MEASURED CONSEQUENCES, all on bun 1.3.14 — read these before you fight it:
#   · There is NO CLI or env escape hatch. `bun install --no-frozen-lockfile`,
#     `BUN_CONFIG_FROZEN_LOCKFILE=false` and `BUN_CONFIG_NO_FROZEN_LOCKFILE=1` were each tried against a
#     perturbed manifest and each still refused. To change a dependency you comment this line out,
#     `bun add`/`bun install`, commit `bun.lock` WITH the manifest, and put it back. That is the point:
#     a dependency change is a deliberate, reviewable act, not a side effect of running a build.
#   · `bun add`/`bun install <pkg>@<ver>` still succeeds when it needs NO lockfile change — which is
#     exactly `packages/novaclaw/script/build.ts`'s all-platform re-install of already-pinned,
#     already-resolved packages (verified: exit 0, 13 platform packages installed,
#     `bun.lock` byte-identical). It refuses `bun add` of anything new.
#   · It is INERT when no lockfile exists at all — a frozen install in a directory with no `bun.lock`
#     resolves freely and writes one. `bun.lock` being tracked is therefore part of the control, and
#     `install-paths.test.ts` asserts that too.
frozenLockfile = true

# Only install newly resolved package versions published at least 3 days ago.
minimumReleaseAge = 259200
minimumReleaseAgeExcludes = ["@ff-labs/fff-bun", "@ff-labs/fff-bin-darwin-arm64", "@ff-labs/fff-bin-darwin-x64", "@ff-labs/fff-bin-linux-arm64-gnu", "@ff-labs/fff-bin-linux-arm64-musl", "@ff-labs/fff-bin-linux-x64-gnu", "@ff-labs/fff-bin-linux-x64-musl", "@ff-labs/fff-bin-win32-arm64", "@ff-labs/fff-bin-win32-x64", "@pierre/diffs", "@pierre/theming", "app-builder-lib", "dmg-builder", "electron-builder", "electron-publish"]

[test]
root = "./do-not-run-tests-from-root"
